name: Blueprint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the blueprint and Lean API docs from main to GitHub Pages"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build blueprint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    concurrency:
      group: blueprint-build-${{ github.workflow }}-${{ github.ref }}
      # Let publication builds finish even when a newer main commit is queued.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'push' && inputs.publish != true) }}

    steps:
      # Free disk space for Lean and Docker.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set the actual repository link
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          repository = os.environ["GITHUB_REPOSITORY"]
          Path("blueprint/src/site-links.tex").write_text(
              "\\github{https://github.com/" + repository + "}\n")
          PYTHON

      - name: Check blueprint labels
        run: ./scripts/check-blueprint-labels.py

      - name: Check documentation cache helpers
        run: |
          bash -n scripts/build-api-docs.sh
          python3 -m unittest discover -s scripts/tests -v

      - name: Generate blueprint LaTeX and declaration metadata
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          build-args: "+Cliquefree.Blueprint:blueprint +Cliquefree.Blueprint:blueprintJson"

      - name: Audit existence scope and proof axioms
        working-directory: lean
        run: |
          lake build Solution
          lake env lean AxiomAudit.lean
          python3 ../scripts/check-blueprint-labels.py \
            --dependencies .lake/build/existence-dependencies.json

      - name: Compute API documentation cache keys
        id: api-docs-key
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
        env:
          CACHE_PREFIX: api-docs-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml', 'scripts/docgen/lakefile.toml', 'scripts/build-api-docs.sh', 'scripts/prune-api-docs.py', '.github/workflows/blueprint.yml') }}
          SOURCE_HASH: ${{ hashFiles('lean/Cliquefree.lean', 'lean/Cliquefree/**/*.lean') }}
        run: |
          echo "prefix=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "key=$CACHE_PREFIX-$SOURCE_HASH" >> "$GITHUB_OUTPUT"

      # Keep project HTML together with its database and build traces. The
      # upstream partial cache omits project HTML but retains its build markers.
      - name: Restore complete API documentation
        id: api-docs-cache
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: docbuild/.lake/build
          key: ${{ steps.api-docs-key.outputs.key }}
          restore-keys: ${{ steps.api-docs-key.outputs.prefix }}-

      # Cache only the generator's extra packages; lean-action already caches
      # the proof dependencies. Separate keys avoid duplicating the generator
      # archive for every source change. Full directories permit Lake to reuse
      # both the Git checkouts and their native build artifacts.
      - name: Restore doc-gen4 generator
        id: docgen-cache
        if: steps.api-docs-key.outcome == 'success' && steps.api-docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            lean/.lake/packages/doc-gen4
            lean/.lake/packages/MD4Lean
            lean/.lake/packages/BibtexQuery
            lean/.lake/packages/UnicodeBasic
            lean/.lake/packages/leansqlite
          key: docgen-${{ steps.api-docs-key.outputs.prefix }}

      - name: Build Lean API documentation incrementally
        if: steps.api-docs-key.outcome == 'success' && steps.api-docs-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-api-docs.sh

      # Save generator artifacts before the disk-space cleanup removes packages.
      - name: Save doc-gen4 generator
        if: steps.docgen-cache.outcome == 'success' && steps.docgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            lean/.lake/packages/doc-gen4
            lean/.lake/packages/MD4Lean
            lean/.lake/packages/BibtexQuery
            lean/.lake/packages/UnicodeBasic
            lean/.lake/packages/leansqlite
          key: docgen-${{ steps.api-docs-key.outputs.prefix }}

      - name: Stage API documentation
        if: steps.api-docs-key.outcome == 'success'
        run: |
          mkdir -p _site/docs
          cp -R docbuild/.lake/build/doc/. _site/docs/

      - name: Reclaim Lean dependency space
        run: |
          rm -rf lean/.lake/packages
          rm -rf /home/runner/.elan
          df -h /

      - name: Render blueprint PDF and website
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --yes --no-install-recommends \
              graphviz libgraphviz-dev python3 python3-pip python3-venv
            python3 -m venv /tmp/cliquefree-blueprint-venv
            /tmp/cliquefree-blueprint-venv/bin/pip install \
              --disable-pip-version-check leanblueprint==0.0.20
            export PATH="/tmp/cliquefree-blueprint-venv/bin:$PATH"
            mkdir -p blueprint/print
            cd blueprint/src
            latexmk -output-directory=../print
            plastex -c plastex.cfg web.tex

      - name: Retain rendered blueprint for review
        uses: actions/upload-artifact@v4
        with:
          name: cliquefree-blueprint
          path: |
            blueprint/print/print.pdf
            blueprint/web/

      # Publish main pushes, with optional manual publication on main.
      - name: Stage Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
        run: |
          mkdir -p _site/blueprint
          cp site/index.html _site/index.html
          cp -R blueprint/web/. _site/blueprint/
          cp blueprint/print/print.pdf _site/blueprint.pdf

      - name: Check staged documentation links
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
        run: ./scripts/check-site-links.py _site

      # Only retain documentation after the blueprint links have been checked.
      - name: Save complete API documentation
        if: steps.api-docs-key.outcome == 'success' && steps.api-docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: docbuild/.lake/build
          key: ${{ steps.api-docs-key.outputs.key }}

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy blueprint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: blueprint-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
